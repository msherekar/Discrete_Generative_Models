# CIS 6270 course environment for DGX Spark (GB10, sm_121).
# Manage with: uv sync  (creates .venv; torch/vision from PyTorch cu130)

[project]
name = "cis6270"
version = "0.1.0"
description = "Course code for CIS 6270 discrete generative models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.57.6",
    "numpy>=1.24",
    "scipy>=1.10",
]

[tool.uv]
package = false

# GB10 reports sm_121; official cu130 wheels ship sm_120 (binary-compatible).
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
