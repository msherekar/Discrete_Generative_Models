# CIS 6270 course environment for DGX Spark (GB10, sm_121).
# Manage with: uv sync  (creates .venv; torch/vision from PyTorch cu130)

[project]
name = "cis6270"
version = "0.1.0"
description = "Course code for CIS 6270 discrete generative models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.57.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.7.2",
    # METL oracle (embedding_oracle.py --backend metl): the metl package imports
    # these at module load, even though inference needs none of their features.
    "pytorch-lightning>=2.6",
    "biopandas>=0.5",
    "biopython>=1.83",
    "shortuuid>=1.0",
    "seaborn>=0.13",
    "wandb>=0.19",
    "sqlalchemy>=2.0",
]

# Every runnable module gets a console script, so a command works from any
# directory once `uv sync` has installed the package. The same modules always
# work as `python -m dgm.project1.<name>` without installing anything.
[project.scripts]
dgm-run-experiment     = "dgm.project1.run_experiment:main"
dgm-evaluate           = "dgm.project1.evaluate:main"
dgm-embedding-oracle   = "dgm.project1.embedding_oracle:main"
dgm-compare-models     = "dgm.project1.compare_models:main"
dgm-gfp-metrics        = "dgm.project1.gfp_metrics:main"
dgm-gfp-oracle         = "dgm.project1.gfp_oracle:main"
dgm-resample-cfg       = "dgm.project1.resample_cfg:main"
dgm-resample           = "dgm.project1.resample:main"
dgm-run-mnist          = "dgm.project1.run_mnist:main"
dgm-prepare-gfp        = "dgm.project1.prepare_gfp:main"
dgm-split-gfp          = "dgm.project1.split_gfp:main"
dgm-add-properties     = "dgm.project1.add_properties:main"
dgm-analyze-sweep      = "dgm.project1.analyze_sweep:main"
dgm-compute-fid        = "dgm.project1.compute_fid:main"
dgm-esm-compare        = "dgm.project1.esm_compare:main"
dgm-oracle-sweep       = "dgm.project1.oracle_sweep:main"
dgm-plot-guidance-sweep = "dgm.project1.plot_guidance_sweep:main"
dgm-wandb              = "dgm.project1.wandb_cli:main"
dgm-study-plots        = "dgm.project1.study_plots:main"
dgm-transfer           = "dgm.project1.transfer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgm"]

# The project is now an installable package (src/dgm), not just a dependency
# set, so uv installs it editable into .venv and the console scripts appear.
[tool.uv]
package = true

# GB10 reports sm_121; official cu130 wheels ship sm_120 (binary-compatible).
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
